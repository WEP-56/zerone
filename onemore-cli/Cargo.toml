[package]
name = "onemore"
version = "0.1.0"
edition = "2021"
description = "Onemore: a reliable and practical coding agent"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WEP-56/onemore"
keywords = ["agent", "coding-agent", "tui"]
categories = ["command-line-utilities"]
exclude = ["/dist/**", "/npm/**", "/scripts/**"]

[dependencies]
# 应用层统一错误处理；后续领域边界逐步升级为类型化错误。
anyhow = "1"
# 序列化:所有 API 报文与配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 每个会话一个 SQLite 数据库；bundled 保证用户无需预装 SQLite。
rusqlite = { version = "0.32", features = ["bundled"] }
# 会话文件名使用随机 UUID，既可跨进程生成，也不泄露路径信息。
uuid = { version = "1", features = ["v4"] }
# HTTP:选阻塞式 ureq 而非 reqwest/tokio——没有异步运行时,数据流一眼可见
ureq = "2"
# TUI:只依赖 ratatui,crossterm 用它的 re-export,避免版本错配
ratatui = "0.29"
# 文本换行(正确处理 CJK 宽度)
textwrap = "0.16"
unicode-width = "0.2"

[profile.release]
strip = true
