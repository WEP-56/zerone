name: Package npm release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: npm package name
        required: true
        default: zerone-agent
      version:
        description: Version override (empty uses Cargo.toml)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            binary: zerone.exe
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
            binary: zerone
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            binary: zerone
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            binary: zerone
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --target ${{ matrix.target }} --target-dir target/npm-build
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/npm-build/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: staging/${{ matrix.binary }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_PACKAGE_NAME: ${{ inputs.package_name || 'zerone-agent' }}
      NPM_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw -Encoding utf8 Cargo.toml
          $version = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
      - uses: actions/download-artifact@v4
        with:
          name: win32-x64
          path: dist/artifacts/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist/artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: dist/artifacts/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: dist/artifacts/darwin-arm64
      - name: Assemble npm tarball
        shell: pwsh
        run: |
          $args = @(
            "-PackageName", $env:NPM_PACKAGE_NAME,
            "-ArtifactsDir", "dist/artifacts",
            "-RequireAllPlatforms",
            "-Pack"
          )
          if ($env:NPM_VERSION) { $args += @("-Version", $env:NPM_VERSION) }
          ./scripts/package-npm.ps1 @args
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.ref_name }}
          path: dist/npm/*.tgz
          if-no-files-found: error
